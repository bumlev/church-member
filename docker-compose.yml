
services:

  # ── PHP Application (Laravel) ───────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: church_member_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - /var/www/vendor          # exclude local vendor from being overwritten
      - /var/www/node_modules    # exclude local node_modules from being overwritten
    env_file:
      - .env.docker          # ← always use Docker-specific env, overrides .env file
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - church_network

  # ── Nginx Web Server ────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: church_member_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - church_network

  # ── MariaDB Database ────────────────────────────────────────────────────────
  mariadb:
    image: mariadb:11
    container_name: church_member_mariadb
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: church_member
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - church_network

# ── Network ─────────────────────────────────────────────────────────────────
networks:
  church_network:
    driver: bridge

# ── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  mariadb_data:
    driver: local



